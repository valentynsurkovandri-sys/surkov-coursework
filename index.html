<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Нотатки — прогресивний веб-застосунок, що працює без інтернету">
  <meta name="theme-color" content="#4f46e5">
  <title>Нотатки — PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">📝 Нотатки</h1>
    <div class="header__right">
      <span id="status" class="status status--online">Онлайн</span>
      <button id="installBtn" class="btn btn--light" hidden>Встановити</button>
    </div>
  </header>

  <main class="container">
    <form id="noteForm" class="note-form">
      <label for="title" class="visually-hidden">Заголовок</label>
      <input id="title" type="text" placeholder="Заголовок" maxlength="80" required>
      <label for="text" class="visually-hidden">Текст нотатки</label>
      <textarea id="text" rows="4" placeholder="Текст нотатки..."></textarea>
      <div class="note-form__actions">
        <button type="submit" id="saveBtn" class="btn">Додати</button>
        <button type="button" id="cancelBtn" class="btn btn--ghost" hidden>Скасувати</button>
      </div>
    </form>

    <label for="search" class="visually-hidden">Пошук</label>
    <input id="search" class="search" type="search" placeholder="🔍 Пошук нотаток...">

    <p id="empty" class="empty">Нотаток поки немає. Додайте першу!</p>
    <ul id="notesList" class="notes"></ul>
  </main>

  <footer class="footer">
    <p>Курсова робота · Сурков Валентин · 2026</p>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
